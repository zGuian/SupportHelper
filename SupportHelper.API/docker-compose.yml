services:
    supporthelper-api:
        build: 
            context: .
            dockerfile: src/SupportHelper.API.WebApi/Dockerfile
        container_name: suppoerhelper-api
        ports:
            - "8085:8085"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://+:8085
            - ConnectionStrings__SQLServer=Server=${SQL_SERVER};Database=DB_SUPPORTHELPER;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;
            - ConnectionStrings__Redis=${REDIS_SERVER}

    redis:
        container_name: redis
        image: redis:bookworm
        command: >
            redis-server --port 6379 --appendonly yes
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"

volumes:
    redis_data: